<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Georgia", "Times New Roman", serif;
        padding: 0;
        margin: 0;
        background: transparent !important;
      }

      input::placeholder {
        color: #a5a5c7;
        opacity: 1;
      }

      .container {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        height: 100%;
        display: flex;
        flex-direction: column;
        border-radius: 16px;
        overflow: hidden;
      }

      .banner-section {
        padding: 14px 20px 12px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        flex-shrink: 0;
        transition: all 0.3s ease;
        overflow: hidden;
      }

      .banner-section.hidden {
        padding: 0;
        max-height: 0;
        opacity: 0;
        border-bottom: none;
        pointer-events: none;
      }

      .header-tagline {
        text-align: center;
        color: #6a1b9a;
        font-size: 13px;
        font-style: italic;
        line-height: 1.4;
        margin-bottom: 8px;
      }

      .title {
        color: #4a148c;
        font-size: 24px;
        font-weight: 300;
        letter-spacing: 2px;
        text-align: center;
        margin-bottom: 0;
      }

      /* Search Section */
      .search-section {
        padding: 10px 20px 12px 20px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        position: relative;
        z-index: 20;
      }

      .search-container {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .search-box {
        flex: 1;
        padding: 10px 15px;
        border: 1px solid rgba(156, 39, 176, 0.15);
        border-radius: 20px;
        font-size: 13px;
        font-family: "Georgia", serif;
        transition: all 0.3s;
        background: rgba(255, 255, 255, 0.3);
        /* ← BAGO: glass */
        backdrop-filter: blur(4px);
        /* ← BAGO: glass */
        -webkit-backdrop-filter: blur(4px);
        /* ← BAGO: glass */
        color: #4a148c;
      }

      .search-box:focus {
        outline: none;
        border-color: #7b1fa2;
        box-shadow: 0 0 12px rgba(123, 31, 162, 0.1);
        background: rgba(255, 255, 255, 0.5);
      }

      .search-btn {
        padding: 10px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: transform 0.2s;
        font-family: "Georgia", serif;
      }

      .search-btn:hover {
        transform: scale(1.05);
      }

      .clear-search {
        padding: 10px 15px;
        background: #e91e63;
        color: white;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 12px;
        display: none;
        font-family: "Georgia", serif;
      }

      .clear-search.visible {
        display: block;
      }

      /* Notes List */
      .notes-list {
        flex: 1;
        overflow-y: auto;
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.05);
      }

      /* Note item - may transition para smooth */
      .note-item {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 12px;
        padding: 15px;
        padding-bottom: 18px;
        margin-bottom: 12px;
        border: 2px solid transparent; /* ← Para hindi mag-jump ang layout */
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        transition: all 0.25s ease; /* ← Smooth transition */
        border-left: 4px solid rgba(156, 39, 176, 0.4);
        cursor: pointer;
        /* ← Para magbago ang cursor */
      }

      .note-item:hover {
        border-color: #e84393;
        /* ← Soft Berry Pink */
        background: rgba(232, 67, 147, 0.05);
        /* ← Very light pink tint */
        box-shadow: 0 6px 20px rgba(232, 67, 147, 0.18);
        /* ← Warm pink glow */
        transform: translateY(-2px);
      }

      .note-item.hidden {
        display: none;
      }

      .note-item.highlight {
        background: #fff9c4;
        animation: highlightPulse 1.5s ease-in-out;
      }

      @keyframes highlightPulse {
        0% {
          background: #ffeb3b;
        }

        100% {
          background: #fff9c4;
        }
      }

      .note-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 8px;
      }

      .note-content {
        flex: 1;
      }

      .note-rhythm {
        color: #6a1b9a;
        font-size: 16px;
        font-weight: bold;
        letter-spacing: 0.5px;
        margin-bottom: 5px;
      }

      .note-label {
        color: #8e8eaf;
        font-size: 12px;
        font-style: italic;
      }

      .perform-btn {
        padding: 8px 16px;
        background: linear-gradient(
          135deg,
          rgba(240, 147, 251, 0.8),
          rgba(245, 87, 108, 0.8)
        );
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.3s;
        font-family: "Georgia", serif;
        flex-shrink: 0;
      }

      .perform-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 16px rgba(245, 87, 108, 0.2);
      }

      .perform-btn.copied {
        background: rgba(76, 175, 80, 0.8);
      }

      /* Footer */
      .footer {
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.1);
        /* ← BAGO: glass */
        backdrop-filter: blur(10px);
        /* ← BAGO: glass */
        -webkit-backdrop-filter: blur(10px);
        /* ← BAGO: glass */
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }

      .footer-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.85),
          rgba(118, 75, 162, 0.85)
        );
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 25px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s;
        letter-spacing: 1px;
        font-family: "Georgia", serif;
      }

      .footer-btn:hover {
        transform: scale(1.02);
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #9c27b0;
        font-style: italic;
        font-size: 15px;
      }

      /* Scrollbar */
      .notes-list::-webkit-scrollbar {
        width: 6px;
      }

      .notes-list::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }

      .notes-list::-webkit-scrollbar-thumb {
        background: rgba(156, 39, 176, 0.2);
        border-radius: 4px;
      }

      .notes-list::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 39, 176, 0.3);
      }

      .scroll-indicator {
        text-align: center;
        padding: 4px 0 2px 0;
        font-size: 10px;
        color: rgba(106, 27, 154, 0.3);
        letter-spacing: 2px;
        transition: opacity 0.3s ease;
      }

      .scroll-indicator.hidden {
        opacity: 0;
        max-height: 0;
        padding: 0;
        pointer-events: none;
      }

      /* Notification Toast */
      .notification-toast {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(-100px);
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-left: 4px solid #9c27b0;
        border-radius: 16px;
        padding: 15px 25px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        z-index: 9999;
        opacity: 0;
        transition: all 0.3s ease-out;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 320px;
      }

      .notification-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .notification-icon {
        font-size: 20px;
      }

      .notification-message {
        color: #424242;
        font-size: 13px;
        font-weight: 500;
      }

      .notification-toast.error {
        border-left-color: #f44336;
      }

      .notification-toast.success {
        border-left-color: #4caf50;
      }
    </style>
  </head>

  <body>
    <!-- Notification Toast -->
    <div id="notificationToast" class="notification-toast">
      <span class="notification-icon" id="notificationIcon">🎵</span>
      <span class="notification-message" id="notificationMessage"></span>
    </div>

    <div class="container">
      <!-- Header -->
      <div class="banner-section" id="bannerSection">
        <div class="header-tagline">"Orchestrate your day into Harmony."</div>
        <div class="title">🎼 TypiPat — Motif</div>
        <div class="scroll-indicator" id="scrollIndicator">▼ scroll ▼</div>
      </div>

      <!-- Search Section -->
      <div class="search-section">
        <div class="search-container">
          <input
            type="text"
            id="searchBox"
            class="search-box"
            placeholder="Search rhythm or harmony..."
          />
          <button id="searchBtn" class="search-btn">Cue</button>
          <button id="clearSearch" class="clear-search">Mute</button>
        </div>
      </div>

      <!-- Notes List -->
      <div class="notes-list" id="notesList">
        <div class="empty-state">Silence. No notes composed yet.</div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <button id="openOptions" class="footer-btn">Orchestra Entrata</button>
      </div>
    </div>

    <script src="utils.js"></script>
    <script src="storage-helper.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
